[project]
name = "foldflow"
version = "0.1.0"
requires-python = ">=3.12,<3.16"
dependencies = [
  "biopython==1.88",
  "numpy>=2.0",
  "scipy>=1.14",
  "torch>=2.6",
  "transformers>=4.48,<5",
]

[project.optional-dependencies]
cpu = ["torch>=2.6"]
cu126 = ["torch==2.11.0; sys_platform == 'linux'"]
cu130 = ["torch>=2.6; sys_platform == 'linux'"]

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cu126"}, {extra = "cu130"}]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
